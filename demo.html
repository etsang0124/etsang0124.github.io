<!DOCTYPE html>
<html lang="en-US">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, maximum-scale=1, user-scalable=no" />
    <title>SkyLoft — Interactive Web App</title>
    <script>
      window.__LOGS__ = [];
      var origErr = console.error;
      console.error = function() {
        window.__LOGS__.push(['console.error', Array.from(arguments).map(function(x) { return String(x && x.stack || x); })]);
        if (origErr) origErr.apply(console, arguments);
      };
      var origWarn = console.warn;
      console.warn = function() {
        window.__LOGS__.push(['console.warn', Array.from(arguments).map(function(x) { return String(x && x.stack || x); })]);
        if (origWarn) origWarn.apply(console, arguments);
      };
      window.addEventListener('error', function(e) {
        window.__LOGS__.push(['window.error', e.message, e.filename, e.lineno, e.colno, e.error ? e.error.stack : '']);
      });
      window.addEventListener('unhandledrejection', function(e) {
        window.__LOGS__.push(['unhandledrejection', String(e.reason && e.reason.stack || e.reason)]);
      });
    </script>
    <!-- React Native Web recommended reset -->
    <style id="expo-reset">
      html, body {
        height: 100%;
        margin: 0;
        padding: 0;
        background-color: #0d1117;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      body {
        overflow: hidden;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
        padding-top: 44px;
        padding-bottom: 22px;
        box-sizing: border-box;
      }
      /* Fallback loading indicator while bundle compiles/evaluates */
      #loading-splash {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #0f172a;
        color: #f8fafc;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        z-index: 99999;
        transition: opacity 0.4s ease;
      }
      .spinner {
        width: 44px;
        height: 44px;
        border: 3px solid rgba(255, 255, 255, 0.15);
        border-top-color: #38bdf8;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin-bottom: 16px;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
    <meta name="theme-color" content="#0f172a">
    <meta name="description" content="SkyLoft — Urban Luxury Rental Marketplace & Engine">
  </head>
  <body>
    <div id="loading-splash">
      <div class="spinner"></div>
      <div style="font-weight: 600; font-size: 1.1rem; letter-spacing: -0.02em;">SkyLoft</div>
      <div style="color: #94a3b8; font-size: 0.85rem; margin-top: 6px;">Initializing React Native runtime...</div>
    </div>
    <noscript>
      <div style="padding: 20px; color: white; text-align: center;">You need to enable JavaScript to run this interactive app.</div>
    </noscript>
    <div id="root"></div>

    <script>
      (function() {
        // Normalize pathname for Expo Router so it mounts root route '/' instead of '/demo.html'
        if (window.location.pathname.endsWith('/demo.html') || window.location.pathname === '/demo.html') {
          try {
            var target = window.location.pathname.replace(/\/demo\.html$/, '/') + (window.location.search || '') + (window.location.hash || '');
            window.history.replaceState(null, '', target);
          } catch(e) {}
        }

        var path = window.location.pathname;
        var dir = path.substring(0, path.lastIndexOf('/') + 1);
        window.__PUBLIC_PATH__ = dir;

        // Hide loading splash once app mounts into #root
        var observer = new MutationObserver(function() {
          var root = document.getElementById('root');
          if (root && root.children.length > 0) {
            var splash = document.getElementById('loading-splash');
            if (splash) {
              splash.style.opacity = '0';
              setTimeout(function() { splash.remove(); }, 400);
            }
            observer.disconnect();
          }
        });
        observer.observe(document.getElementById('root'), { childList: true, subtree: true });

        function showLoadError(detail) {
          var splash = document.getElementById('loading-splash');
          if (splash) {
            splash.style.opacity = '1';
            splash.innerHTML =
              '<div style="padding: 24px; text-align: center; max-width: 290px;">' +
                '<div style="font-size: 28px; margin-bottom: 12px;">⚠️</div>' +
                '<div style="font-weight: 700; font-size: 1rem; margin-bottom: 6px; color: #f87171;">Runtime Load Error</div>' +
                '<div style="font-size: 0.8rem; color: #94a3b8; line-height: 1.45; margin-bottom: 18px;">' + (detail || 'The interactive mobile bundle could not be loaded.') + '</div>' +
                '<button onclick="location.reload()" style="background: #38bdf8; color: #090d16; font-weight: 700; font-size: 0.85rem; border: none; border-radius: 8px; padding: 8px 18px; cursor: pointer;">Reload Demo</button>' +
              '</div>';
          }
        }

        // Fallback safety check: verify root mounted
        setTimeout(function() {
          var root = document.getElementById('root');
          if (!root || root.children.length === 0) {
            showLoadError('Runtime initialization timed out.');
          }
        }, 6000);

        var s = document.createElement('script');
        s.src = dir + '_expo/static/js/web/entry-ae7e3a67721d9a8498f6d00c8d63e09a.js?v=2';
        s.defer = true;
        s.onerror = function() {
          showLoadError('Bundle request returned an error. Verify .nojekyll exists.');
        };
        document.body.appendChild(s);
      })();
    </script>
  </body>
</html>
